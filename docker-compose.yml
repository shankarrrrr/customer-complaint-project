version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: complaints_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: complaints_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: complaints_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: complaints_fastapi
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/complaints_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-python:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: complaints_celery
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/complaints_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend-python:/app
    command: celery -A celery_worker worker --loglevel=info

  node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: complaints_node
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/complaints_db
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    command: npm run dev

  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: complaints_nextjs
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=http://localhost:3001
    depends_on:
      - fastapi
      - node
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
